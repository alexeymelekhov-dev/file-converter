databaseChangeLog:
  - changeSet:
      id: 001-create-inbox
      author: Alexey
      changes:
        - createTable:
            tableName: inbox
            columns:
              - column:
                  name: event_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: processed_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueDate: now()
                  constraints:
                    nullable: false
